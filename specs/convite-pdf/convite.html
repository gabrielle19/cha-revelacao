<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  rel="stylesheet"

<style>
  /* Convite de WhatsApp: página única 1080×1350 (4:5), mesma paleta do site.
     O render.js "achata" tudo numa imagem, então sombras/filtros são seguros. */
  :root {
    --cream: #faf6f0;
    --beige: #e8dcc8;
    --caramel: #c9a574;
    --label: #b08968;
    --label-deep: #8b6f52;
    --dark: #5c4433;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    position: relative;
    overflow: hidden;
    color: var(--dark);
    font-family: "Quicksand", sans-serif;
    background:
      radial-gradient(ellipse 60% 38% at 50% 2%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 70%),
      radial-gradient(circle 340px at 6% 72%, rgba(232, 196, 203, 0.24), rgba(232, 196, 203, 0) 70%),
      radial-gradient(circle 340px at 96% 40%, rgba(195, 213, 227, 0.2), rgba(195, 213, 227, 0) 70%),
      radial-gradient(ellipse 55% 30% at 50% 70%, rgba(240, 210, 150, 0.35), rgba(240, 210, 150, 0) 70%),
      linear-gradient(180deg, #fcf8f2 0%, #f6ecde 55%, #eddfc9 100%);
  }

  /* ── Camadas decorativas ── */
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .layer svg { position: absolute; }
  .pattern svg { fill: var(--caramel); opacity: 0.15; }

  /* ── Moldura ── */
  .frame {
    position: absolute; inset: 34px;
    border: 1.5px solid rgba(176, 137, 104, 0.6);
    border-radius: 26px;
  }
  .frame::after {
    content: ""; position: absolute; inset: 12px;
    border: 1px dashed rgba(176, 137, 104, 0.38);
    border-radius: 18px;
  }
  .corner { position: absolute; width: 96px; height: 96px; }
  .corner.tl { top: 22px; left: 22px; }
  .corner.tr { top: 22px; right: 22px; transform: scaleX(-1); }
  .corner.bl { bottom: 22px; left: 22px; transform: scaleY(-1); }
  .corner.br { bottom: 22px; right: 22px; transform: scale(-1, -1); }
  .diamond {
    position: absolute; width: 12px; height: 12px; background: var(--caramel);
    transform: translate(-50%, -50%) rotate(45deg);
  }

  /* ── Bandeirinhas ── */
  .garland { position: absolute; left: 0; top: 40px; width: 1080px; height: 130px; }

  /* ── Nuvens do rodapé (dentro da moldura) ── */
  .clouds {
    position: absolute; left: 35px; right: 35px; bottom: 35px; height: 190px;
    border-radius: 0 0 25px 25px; overflow: hidden;
  }
  .clouds svg { position: absolute; left: 0; bottom: 0; width: 100%; }

  /* ── Conteúdo ── */
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 150px 100px 0;
    text-align: center;
  }
  .kicker {
    display: flex; align-items: center; gap: 22px;
    font-weight: 700; font-size: 25px; letter-spacing: 0.42em;
    color: var(--label-deep); text-transform: uppercase;
  }
  .kicker .rule { width: 90px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--label)); }
  .kicker .rule.r { background: linear-gradient(-90deg, transparent, var(--label)); }
  .kicker span.t { margin-right: -0.42em; }

  h1 {
    margin-top: 18px;
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: 96px; line-height: 0.98; letter-spacing: -0.01em;
    color: var(--dark);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.7), 0 10px 26px rgba(92, 68, 51, 0.12);
  }
  h1 .ou {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin: 4px 0 2px;
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
    font-size: 54px; line-height: 1; color: var(--label);
    text-shadow: none;
  }
  h1 .ou i { display: block; width: 70px; height: 1.5px; background: rgba(176, 137, 104, 0.5); }
  h1 .ou svg { width: 16px; height: 16px; }

  .date {
    margin-top: 24px;
    display: inline-flex; align-items: center; gap: 18px;
    padding: 14px 36px;
    border: 2px solid #e6d3b6; border-radius: 999px;
    background: linear-gradient(180deg, #ffffff, #fbf4ea);
    box-shadow: 0 10px 24px -14px rgba(92, 68, 51, 0.45);
    font-weight: 700; font-size: 27px; color: var(--label-deep);
  }
  .date .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--caramel); }

  .poem {
    margin-top: 22px; max-width: 840px; text-wrap: balance;
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
    font-size: 34px; line-height: 1.36; color: var(--dark);
  }
  .poem .sep { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 8px 0; }
  .poem .sep i { width: 40px; height: 1px; background: rgba(176, 137, 104, 0.45); }

  /* ── Envelope (link para o site) ── */
  a.open { display: block; color: inherit; text-decoration: none; }
  .scene { position: relative; width: 620px; height: 400px; margin-top: 8px; }
  .peek { position: absolute; left: 50%; top: 0; width: 120px; margin-left: -60px; }
  .paws { position: absolute; left: 50%; top: 62px; width: 150px; margin-left: -75px; z-index: 3; }
  .envelope {
    position: absolute; left: 0; right: 0; bottom: 0; height: 330px;
    border-radius: 14px;
    background: linear-gradient(180deg, #dcc6a6 0%, #cfb592 100%);
    box-shadow:
      0 44px 60px -30px rgba(92, 68, 51, 0.6),
      0 12px 22px -12px rgba(92, 68, 51, 0.3),
      0 2px 0 rgba(255, 255, 255, 0.55) inset;
    overflow: hidden;
  }
  .envelope svg.folds { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seal-glow {
    position: absolute; left: 50%; top: 185px; width: 360px; height: 360px; margin: -180px 0 0 -180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 236, 196, 0.75) 0%, rgba(255, 236, 196, 0) 62%);
  }
  .seal { position: absolute; left: 50%; top: 185px; width: 244px; height: 244px; margin: -122px 0 0 -122px; overflow: visible; }

  .sign {
    position: absolute; left: 0; right: 0; bottom: 74px;
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 600;
    font-size: 33px; color: var(--label-deep);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
</style>
</head>

<script>
  let seed = 20261121;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const NS = "http://www.w3.org/2000/svg";
  const put = (box, x, y, size, href, style = {}) => {
    const el = document.createElementNS(NS, "svg");
    el.setAttribute("width", size); el.setAttribute("height", size);
    Object.assign(el.style, { left: x - size / 2 + "px", top: y - size / 2 + "px", ...style });
    el.innerHTML = `<use href="#${href}" />`;
    box.appendChild(el);
    return el;
  };

  // Borda orgânica do selo de cera.
  (function () {
    const cx = 104, cy = 104, n = 22, pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = (Math.PI * 2 * i) / (n * 2);
      const r = (i % 2 ? 94 : 99) + Math.sin(i * 1.7) * 1.6;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    let d = "M" + pts[0].join(" ");
    for (let i = 1; i <= pts.length; i++) {
      const p = pts[i % pts.length], q = pts[(i - 1) % pts.length];
      d += ` Q${q[0].toFixed(1)} ${q[1].toFixed(1)} ${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`;
    }
    document.getElementById("blob").setAttribute("d", d + "Z");
  })();

  // Bandeirinhas: duas curvas penduradas, bandeiras alternando rosa/creme/azul.
  (function () {
    const g = document.getElementById("garland");
    const colors = ["#E8C4CB", "#F3E4CC", "#C3D5E3", "#E0CBAB"];
    let html = "";
    const swag = (x0, x1, y0, sag, offset) => {
      const q = (t) => {
        const x = x0 + (x1 - x0) * t;
        const y = y0 + 4 * sag * t * (1 - t);
        return [x, y];
      };
      html += `<path d="M${x0} ${y0} Q${(x0 + x1) / 2} ${y0 + sag * 2} ${x1} ${y0}" fill="none" stroke="#B08968" stroke-width="1.6" opacity=".7"/>`;
      const n = 7;
      for (let i = 1; i <= n; i++) {
        const t = i / (n + 1);
        const [x, y] = q(t);
        const c = colors[(i + offset) % colors.length];
        const tilt = (t - 0.5) * -24;
        html += `<g transform="translate(${x} ${y}) rotate(${tilt})"><path d="M-14 0 L14 0 L0 30 Z" fill="${c}"/><path d="M-14 0 L14 0" stroke="rgba(92,68,51,.18)" stroke-width="2"/></g>`;
      }
    };
    swag(120, 540, 22, 30, 0);
    swag(540, 960, 22, 30, 2);
    // lacinho no centro
    html += `<g transform="translate(540 22)"><path d="M0 0 C-14 -12 -26 -4 -22 6 C-18 14 -6 8 0 0 Z M0 0 C14 -12 26 -4 22 6 C18 14 6 8 0 0 Z" fill="#E8C4CB"/><circle r="5" fill="#C9A574"/></g>`;
    g.innerHTML = html;
  })();

  // Estampa discreta nas laterais.
  (function () {
    const box = document.getElementById("pattern");
    const shapes = ["bear", "paw", "heart"];
    [
      [95, 300], [985, 300], [90, 520], [990, 560], [80, 760], [1000, 800],
      [230, 420], [850, 440],
    ].forEach(([x, y], i) => put(box, x, y, 34 + rnd() * 28, shapes[i % 3], { transform: `rotate(${(rnd() - 0.5) * 40}deg)` }));
  })();

  // Brilhos dourados e confetes pastel (vida sem pesar).
  (function () {
    const box = document.getElementById("sparkles");
    [
      [258, 250, 30], [822, 236, 22], [215, 470, 16], [790, 410, 26],
      [210, 900, 22], [880, 880, 18], [345, 1060, 16], [735, 1050, 20],
      [130, 620, 14], [955, 660, 14],
    ].forEach(([x, y, s]) =>
      put(box, x, y, s, "sparkle", { fill: rnd() < 0.5 ? "#D6A96A" : "#E6C58F", opacity: 0.85 })
    );
    const conf = ["#E8C4CB", "#C3D5E3", "#E0CBAB", "#D6A96A"];
    [
      [180, 205], [905, 205], [120, 380], [965, 420], [195, 610], [900, 610],
      [110, 700], [975, 720], [260, 800], [830, 790], [190, 1030], [890, 1030],
    ].forEach(([x, y], i) => {
      const d = document.createElement("span");
      const s = 7 + rnd() * 6;
      Object.assign(d.style, {
        position: "absolute", left: x + "px", top: y + "px", width: s + "px", height: s + "px",
        borderRadius: i % 3 === 0 ? "2px" : "50%", background: conf[i % conf.length],
        transform: `rotate(${rnd() * 60}deg)`, opacity: 0.8,
      });
      box.appendChild(d);
    });
  })();
</script>
</body>
</html>
