services:
  - type: web
    name: cha-revelacao
    # Static Site: publica a pasta `out/` gerada pelo `next build` (output: export).
    # Sem servidor, sem "dormir", sem cold start.
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
