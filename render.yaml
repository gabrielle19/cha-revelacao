services:
  - type: web
    name: cha-revelacao
    # Static Site: publica a pasta `out/` gerada pelo `next build` (output: export).
    # Sem servidor, sem "dormir", sem cold start.
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeploy: true
    # NÃO use rewrite catch-all (/* -> /index.html): este é um site estático de
    # várias páginas (um .html por rota), não uma SPA. As regras abaixo mapeiam
    # as URLs "limpas" para os arquivos .html gerados pelo `next build`.
    routes:
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /admin/recados/imprimir
        destination: /admin/recados/imprimir.html
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
